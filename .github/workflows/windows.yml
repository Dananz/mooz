# Builds, lints and tests the Windows app natively on a Windows runner and
# uploads the packaged Mooz.exe as an artifact.
name: windows

on:
  pull_request:
    paths: ["windows/**", "VERSION", ".github/workflows/windows*.yml"]
  push:
    branches: [main]
    paths: ["windows/**", "VERSION", ".github/workflows/windows*.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install packaging tool
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Mooz-windows-x64
          path: windows/dist/releases/*
      - name: Install, upgrade and uninstall smoke test
        shell: pwsh
        run: ./scripts/smoke-install.ps1
      - name: Capture Windows settings
        shell: pwsh
        run: ./scripts/capture-settings.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mooz-settings-windows
          path: windows/dist/settings-shots/*
