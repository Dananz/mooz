[package]
name = "mooz"
# Placeholder only: the shipped version comes from the repo-root VERSION file
# (build.rs exports it as MOOZ_VERSION), the same source the macOS app uses.
version = "0.0.0"
edition = "2021"
description = "Trackpad pinch-to-zoom for any mouse, on Windows."
license = "MIT"
publish = false

[[bin]]
name = "Mooz"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
velopack = "=1.2.161"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
